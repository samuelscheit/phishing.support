name: phishing-reporter

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8014:3000"
    environment:
      DB_FILE_NAME: /app/data/phishing_reporter.sqlite
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://phishing.support}
      # One mail account: SMTP_FROM sends every report; the IMAP_MAILBOXES
      # folders receive forwarded phishing mail (IMAP_LISTEN_ADDRESS) and provider replies to
      # generated abuse-<token>@REPLY_DOMAIN identities.
      REPLY_DOMAIN: ${REPLY_DOMAIN:-phishing.support}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-support@phishing.support}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_SECURE: ${IMAP_SECURE:-true}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_MAILBOXES: ${IMAP_MAILBOXES:-phishing.report,phishing.support}
      IMAP_LISTEN_ADDRESS: ${IMAP_LISTEN_ADDRESS:-report@phishing.support}
      SKYVERN_BASE_URL: http://skyvern:8000
      SKYVERN_API_KEY_FILE: /run/skyvern/api-key
      SKYVERN_INTERNAL_S3_ORIGIN: http://skyvern-minio:9000
      ABUSE_SKYVERN_WEBHOOK_URL: http://app:3000/api/skyvern/webhook
      ABUSE_GENERIC_FORM_ESCALATION_ENABLED: ${ABUSE_GENERIC_FORM_ESCALATION_ENABLED:-false}
      # Keep resolution/reconciliation capacity separate from slow
      # CAPTCHA/browser work. A stalled provider must never starve intake.
      ABUSE_WORKER_CONTROL_CONCURRENCY: ${ABUSE_WORKER_CONTROL_CONCURRENCY:-2}
      ABUSE_WORKER_EXTERNAL_CONCURRENCY: ${ABUSE_WORKER_EXTERNAL_CONCURRENCY:-2}
      ABUSE_WORKER_CONTROL_JOB_TIMEOUT_MS: ${ABUSE_WORKER_CONTROL_JOB_TIMEOUT_MS:-300000}
      ABUSE_WORKER_EXTERNAL_JOB_TIMEOUT_MS: ${ABUSE_WORKER_EXTERNAL_JOB_TIMEOUT_MS:-600000}
      # Analysis, report drafting, and reply classification share one model
      # endpoint. .env is excluded from the image; values are injected at start.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-45000}
      # Tencent's direct provider route still uses its own explicit solver and
      # HTTP proxy boundary; these values are not used to launch a browser.
      DEATHBYCAPTCHA_USERNAME: ${DEATHBYCAPTCHA_USERNAME:-}
      DEATHBYCAPTCHA_PASSWORD: ${DEATHBYCAPTCHA_PASSWORD:-}
      PROXY_URL: ${PROXY_URL:-}
      # Patchright logs in through Fabric direct egress; cached dashboard
      # credentials authorize single-shot HTTP abuse-report submissions.
      ABUSE_CLOUDFLARE_ACCOUNT_ID: ${ABUSE_CLOUDFLARE_ACCOUNT_ID:-}
      ABUSE_CLOUDFLARE_LOGIN_EMAIL: ${ABUSE_CLOUDFLARE_LOGIN_EMAIL:-}
      ABUSE_CLOUDFLARE_LOGIN_PASSWORD: ${ABUSE_CLOUDFLARE_LOGIN_PASSWORD:-}
      # Reproduces the tracking token of a retried public API report that
      # carries an idempotency key; only the token's hash is stored.
      ABUSE_TRACKING_TOKEN_SECRET: ${ABUSE_TRACKING_TOKEN_SECRET:?Set ABUSE_TRACKING_TOKEN_SECRET to at least 32 random bytes}
      EXFILTRATION_SKYVERN_MAX_STEPS: ${EXFILTRATION_SKYVERN_MAX_STEPS:-80}
      # Browser Fabric is mandatory for every browser operation. The app talks
      # only to its private authenticated relay; Fabric owns the API credential,
      # Chromium, profiles, egress, and CDP capabilities.
      FABRIC_API_URL: ${FABRIC_API_URL:?Set FABRIC_API_URL}
      FABRIC_PROJECT: ${FABRIC_PROJECT:?Set FABRIC_PROJECT}
      FABRIC_PHISHING_PROFILE_REF: ${FABRIC_PHISHING_PROFILE_REF:?Set FABRIC_PHISHING_PROFILE_REF}
      FABRIC_PHISHING_RECIPE_REF: ${FABRIC_PHISHING_RECIPE_REF:?Set FABRIC_PHISHING_RECIPE_REF}
      # Phishing-page browsing exits through Tor; reporting (provider portals,
      # dashboards) exits directly.
      FABRIC_PHISHING_EGRESS_POLICY_REF: ${FABRIC_PHISHING_EGRESS_POLICY_REF:-egress_tor-egress@1}
      FABRIC_REPORTING_EGRESS_POLICY_REF: ${FABRIC_REPORTING_EGRESS_POLICY_REF:-egress_direct-egress@1}
      FABRIC_PHISHING_ARTIFACT_POLICY_REF: ${FABRIC_PHISHING_ARTIFACT_POLICY_REF:?Set FABRIC_PHISHING_ARTIFACT_POLICY_REF}
      FABRIC_PHISHING_TTL_SECONDS: ${FABRIC_PHISHING_TTL_SECONDS:?Set FABRIC_PHISHING_TTL_SECONDS}
      FABRIC_CDP_RELAY_URL: http://fabric-cdp-relay:8085
    volumes:
      - phishing_reporter_data:/app/data
      - skyvern_api_key:/run/skyvern:ro
    networks:
      - default
      - fabric-phishing
    depends_on:
      skyvern:
        condition: service_started
      skyvern-minio:
        condition: service_healthy

  skyvern-postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyvern
      # Required rather than defaulted: these services hold Skyvern run data
      # and permanent artifacts, so development-style credentials are never a
      # safe implicit production configuration.
      POSTGRES_PASSWORD: ${SKYVERN_POSTGRES_PASSWORD:?Set SKYVERN_POSTGRES_PASSWORD to a deployment secret}
      POSTGRES_DB: skyvern
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - skyvern_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyvern -d skyvern"]
      interval: 5s
      timeout: 5s
      retries: 20

  skyvern-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SKYVERN_MINIO_ROOT_USER:?Set SKYVERN_MINIO_ROOT_USER to a deployment secret}
      MINIO_ROOT_PASSWORD: ${SKYVERN_MINIO_ROOT_PASSWORD:?Set SKYVERN_MINIO_ROOT_PASSWORD to a deployment secret}
    volumes:
      - skyvern_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  skyvern-minio-init:
    image: minio/mc:latest
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${SKYVERN_MINIO_ROOT_USER:?Set SKYVERN_MINIO_ROOT_USER to a deployment secret}
      MINIO_ROOT_PASSWORD: ${SKYVERN_MINIO_ROOT_PASSWORD:?Set SKYVERN_MINIO_ROOT_PASSWORD to a deployment secret}
    entrypoint: ["/bin/sh", "/opt/minio-init.sh"]
    volumes:
      - ./docker/skyvern/minio-init.sh:/opt/minio-init.sh:ro
    depends_on:
      skyvern-minio:
        condition: service_healthy

  skyvern:
    image: public.ecr.aws/skyvern/skyvern@sha256:f0c56aa4e19deb14c72d535ddb08a37c14efcf1ef1f32bd124eebb1d7e0b788f
    restart: unless-stopped
    environment:
      ENV: local
      DATABASE_STRING: postgresql+psycopg://skyvern:${SKYVERN_POSTGRES_PASSWORD:?Set SKYVERN_POSTGRES_PASSWORD to a deployment secret}@skyvern-postgres:5432/skyvern
      BROWSER_TYPE: cdp-connect
      SKYVERN_STORAGE_TYPE: s3
      AWS_ENDPOINT_URL: http://skyvern-minio:9000
      AWS_CONFIG_FILE: /etc/aws/config
      AWS_ACCESS_KEY_ID: ${SKYVERN_MINIO_ROOT_USER:?Set SKYVERN_MINIO_ROOT_USER to a deployment secret}
      AWS_SECRET_ACCESS_KEY: ${SKYVERN_MINIO_ROOT_PASSWORD:?Set SKYVERN_MINIO_ROOT_PASSWORD to a deployment secret}
      AWS_S3_BUCKET_ARTIFACTS: skyvern-artifacts
      AWS_S3_BUCKET_SCREENSHOTS: skyvern-screenshots
      AWS_S3_BUCKET_BROWSER_SESSIONS: skyvern-browser-sessions
      AWS_S3_BUCKET_UPLOADS: skyvern-uploads
      AWS_EC2_METADATA_DISABLED: "true"
      PORT: "8000"
      MAX_STEPS_PER_RUN: ${SKYVERN_MAX_STEPS_PER_RUN:-120}
      MAX_STEPS_PER_TASK_V2: ${SKYVERN_MAX_STEPS_PER_TASK_V2:-120}
      OPENAI_API_KEY: ${SKYVERN_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_API_BASE: ${SKYVERN_OPENAI_API_BASE:-${OPENAI_API_BASE_URL:-https://api.openai.com/v1}}
      LLM_KEY: ${SKYVERN_LLM_KEY:-OPENAI_GPT4O}
      ENABLE_OPENAI: ${SKYVERN_ENABLE_OPENAI:-false}
    volumes:
      - ./docker/skyvern/aws-config:/etc/aws/config:ro
    networks:
      - default
      - fabric-phishing
    depends_on:
      skyvern-postgres:
        condition: service_healthy
      skyvern-minio-init:
        condition: service_completed_successfully

  skyvern-api-key-bootstrap:
    image: curlimages/curl:latest
    restart: "no"
    entrypoint: ["/bin/sh", "/opt/bootstrap-api-key.sh"]
    volumes:
      - ./docker/skyvern/bootstrap-api-key.sh:/opt/bootstrap-api-key.sh:ro
      - skyvern_api_key:/run/skyvern
    depends_on:
      skyvern:
        condition: service_started

volumes:
  phishing_reporter_data:
  skyvern_postgres_data:
  skyvern_minio_data:
  skyvern_api_key:

networks:
  fabric-phishing:
    name: ${FABRIC_DOCKER_NETWORK_PHISHING:-browser-fabric-phishing}
    external: true
