services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8014:3000"
        environment:
            # SQLite database file inside the container
            DB_FILE_NAME: /app/data/phishing_reporter.sqlite

            DOCKER: "true"
            NEXT_PUBLIC_SITE_URL: https://phishing.support

            # Set these via your deployment environment / secrets manager
            # OPENAI_API_KEY: ""
            # OPENAI_API_BASE_URL: "https://api.openai.com/v1"
            # SMTP_HOST: ""
            # SMTP_PORT: "587"
            # SMTP_USER: ""
            # SMTP_PASS: ""
            # SMTP_FROM: "support@phishing.support"

            # Correspondence-enabled abuse reports use a random Reply-To local
            # part under this domain. Enable iCloud Custom Email Domain's
            # “Allow All Incoming Emails” catch-all and make sure it lands in
            # the mailbox selected by the IMAP settings below.
            REPORT_REPLY_DOMAIN: phishing.support
            # IMAP_HOST: "imap.mail.me.com"
            # IMAP_PORT: "993"
            # IMAP_SECURE: "true"
            # IMAP_USER: ""
            # IMAP_PASS: ""
            # IMAP_MAILBOX: "phishing.report"
            # IMAP_LISTEN_ADDRESS: "report@phishing.support"

        volumes:
            - phishing_reporter_data:/app/data
        restart: unless-stopped

volumes:
    phishing_reporter_data:
